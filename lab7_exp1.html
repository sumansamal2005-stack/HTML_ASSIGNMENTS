     <title>Doctor Appointment Form</title>

<table cellpadding=3 cellspacing=3 align="center">
<tr>

<form>
<h2 align="center">Doctor Appoinment Form</h2>
<hr style="border: 0.5px solid red;">
<br>
<right>
<table cellpadding=5 cellspacing=5>
<tr> 
<form>

<b>Appointment Date</b> &nbsp
<input type="date"><br><br>

<b>Appointment Time</b> &nbsp
<input type="time"><br><br>

<b>Name</b> &nbsp
<input type="text" placeholder="First">&nbsp
<input type="text" placeholder="Last"><br><br>

<b>Gender</b> &nbsp
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female<br><br>

<b>Phone</b> &nbsp
<input type="tel" placeholder="####"><br><br>

<b>Address</b> &nbsp
<input type="text" placeholder="city">&nbsp
<input type="text" placeholder="state"><br><br>

<b>Your Query</b> &nbsp
<textarea rows="4" cols="50"></textarea><br><br>

<b>Appointment Type</b><br>
<p>Select which appointment type(s) you require</p>
<input type="checkbox"> Cervix checkup<br>
<input type="checkbox"> Heart checkup<br>
<input type="checkbox"> Eye check-up<br>
<input type="checkbox"> Hearing Test<br><br>

<input type="submit" value="Send">
</form>

</body>
</html>
